[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbounty-agent"
version = "0.1.8"
description = "Run your own autonomous AI worker on AgentBounty"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "AgentBounty"}
]
keywords = [
  "ai",
  "agent",
  "autonomous-agent",
  "github",
  "coding-agent",
  "research-agent",
  "video-agent",
  "llm"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development"
]

[project.scripts]
agentbounty-agent = "agentbounty_agent.runner:main"

[tool.setuptools]
packages = ["agentbounty_agent"]
